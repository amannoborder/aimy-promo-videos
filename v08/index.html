<script>
const W=1920,H=1080,DUR=52.5; window.DUR=DUR;
const P='../en-pack/';
const NS='http://www.w3.org/2000/svg';
const INK='#1f1d1b';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(u,a,b)=>clamp((u-a)/(b-a));
const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const eout=x=>1-Math.pow(1-x,3);
const ein=x=>x*x*x;
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280-.5}}

// rough rounded rect path starting at top-left with overshoot tick
function rrect(x,y,w,h,r=16,seed=1,j=1.6){
  const R=rng(seed),q=()=>R()*j*2;
  const p=[];
  p.push(`M${x+r-10} ${y+2+q()}`);
  p.push(`L${x+w*0.5} ${y+q()}`);
  p.push(`L${x+w-r} ${y+q()}`);
  p.push(`Q${x+w+q()} ${y} ${x+w+q()} ${y+r}`);
  p.push(`L${x+w+q()} ${y+h*0.5}`);
  p.push(`L${x+w+q()} ${y+h-r}`);
  p.push(`Q${x+w} ${y+h+q()} ${x+w-r} ${y+h+q()}`);
  p.push(`L${x+w*0.5} ${y+h+q()}`);
  p.push(`L${x+r} ${y+h+q()}`);
  p.push(`Q${x+q()} ${y+h} ${x+q()} ${y+h-r}`);
  p.push(`L${x+q()} ${y+h*0.5}`);
  p.push(`L${x+q()} ${y+r}`);
  p.push(`Q${x} ${y-1} ${x+r} ${y-1}`);
  p.push(`L${x+r+22} ${y-3}`);
  return p.join(' ');
}
function rline(x1,y1,x2,y2,seed=3,j=1.5){const R=rng(seed);const mx=(x1+x2)/2+R()*j*2,my=(y1+y2)/2+R()*j*2;return `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`}
function ellipsePath(cx,cy,rx,ry,turns=1.08,seed=5){const R=rng(seed);let d='';const n=60;for(let i=0;i<=n;i++){const a=-2.6+i/n*Math.PI*2*turns;const k=1+R()*0.03+i/n*0.05;const x=cx+Math.cos(a)*rx*k,y=cy+Math.sin(a)*ry*k;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '}return d}

// ---------- scene builder ----------
const scenes=[];
const pencilEl=document.getElementById('pencil');
function makeScene(S,E,build){
  const el=document.createElement('div');el.className='scene';document.getElementById('scenes').appendChild(el);
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','ink');svg.setAttribute('viewBox','0 0 1920 1080');el.appendChild(svg);
  const ctx=new Ctx(el,svg);build(ctx);
  scenes.push({S,E,el,ctx});
}
class Ctx{
  constructor(el,svg){this.el=el;this.svg=svg;this.ops=[];this.svgTop=null}
  op(o){this.ops.push(o);return o}
  layer(){ // new svg above html content so later strokes sit on top
    const s=document.createElementNS(NS,'svg');s.setAttribute('class','ink');s.setAttribute('viewBox','0 0 1920 1080');this.el.appendChild(s);this.svg=s;return s}
  path(d,a,b,o={}){
    const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');
    p.setAttribute('stroke',o.stroke||INK);p.setAttribute('stroke-width',o.w||3.6);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
    (o.parent||this.svg).appendChild(p);
    let L=null;const len=()=>L||(L=p.getTotalLength());
    p.style.strokeDasharray='100000';
    const pen=o.pen!==false;
    return this.op({a,b,el:p,apply:pp=>{pp=o.ease?o.ease(pp):pp;p.style.strokeDashoffset=String(100000-len()*pp+ (pp>=1?0:0));p.style.strokeDasharray=`${len()*pp+0.01} 100000`;p.style.strokeDashoffset='0';p.style.visibility=pp<=0?'hidden':'visible'},
      tip:pen?(pp=>{const q=p.getPointAtLength(len()*(o.ease?o.ease(pp):pp));return o.xf?o.xf(q):[q.x,q.y]}):null});
  }
  shape(tag,attrs,a,b,parent){ // filled svg shape fading in
    const s=document.createElementNS(NS,tag);for(const k in attrs)s.setAttribute(k,attrs[k]);(parent||this.svg).appendChild(s);
    return this.op({a,b,el:s,apply:pp=>{s.style.opacity=pp}});
  }
  frame(x,y,w,h,a,b,o={}){ // fill + rough outline
    if(o.fill!==null){const f=document.createElementNS(NS,'rect');Object.entries({x,y,width:w,height:h,rx:o.r||16,fill:o.fill||'url(#paper)'}).forEach(([k,v])=>f.setAttribute(k,v));this.svg.appendChild(f);
      this.op({a:a+(b-a)*0.3,b:b,el:f,apply:pp=>{f.style.opacity=pp}})}
    return this.path(rrect(x,y,w,h,o.r||16,o.seed||Math.round(x+y),o.j),a,b,{w:o.w||4,ease:eio,stroke:o.stroke,pen:!!o.pen});
  }
  text(str,x,y,cls,a,b,o={}){
    const d=document.createElement('div');d.className='t '+cls;d.innerHTML=str;d.style.left=x+'px';d.style.top=y+'px';
    if(o.size)d.style.fontSize=o.size+'px';if(o.color)d.style.color=o.color;if(o.style)Object.assign(d.style,o.style);
    (o.parent||this.el).appendChild(d);
    if(o.center){d.dataset.center=1}
    const pen=o.pen!==false;
    let wd=null;
    const place=()=>{if(o.center&&!d._c){d.style.left=(x-d.offsetWidth/2)+'px';d._c=1}};
    return this.op({a,b,el:d,apply:pp=>{place();if(pp>=1){d.style.clipPath='none';d.style.visibility='visible';return}
        d.style.visibility=pp<=0?'hidden':'visible';d.style.clipPath=`inset(-30px ${(1-pp)*100}% -30px -30px)`},
      tip:pen?(pp=>{place();return [d.offsetLeft+d.offsetWidth*pp, d.offsetTop+d.offsetHeight*0.72]}):null});
  }
  img(src,x,y,w,h,a,b,o={}){
    const bx=document.createElement('div');bx.className='box';Object.assign(bx.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:(o.r||6)+'px'});
    if(o.html){bx.innerHTML=o.html}else{const im=document.createElement('img');im.src=src;if(o.pos)im.style.objectPosition=o.pos;if(o.fit)im.style.objectFit=o.fit;if(o.bg)bx.style.background=o.bg;bx.appendChild(im)}
    if(o.style)Object.assign(bx.style,o.style);
    (o.parent||this.el).appendChild(bx);
    const pen=o.pen!==false;
    return this.op({a,b,el:bx,apply:pp=>{if(pp>=1){bx.style.clipPath='none';bx.style.visibility='visible';return}bx.style.visibility=pp<=0?'hidden':'visible';bx.style.clipPath=`inset(0 ${(1-pp)*100}% 0 0)`},
      tip:pen?(pp=>[x+w*pp, y+h*(0.5+0.36*Math.sin(pp*Math.PI*7))]):null});
  }
  hl(x,y,w,h,a,b,rot=-1){
    const d=document.createElement('div');d.className='hl';Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});this.el.appendChild(d);
    return this.op({a,b,el:d,apply:pp=>{d.style.transform=`rotate(${rot}deg) scaleX(${eout(pp)})`;d.style.visibility=pp<=0?'hidden':'visible'}});
  }
  fade(el,a,b,o={}){return this.op({a,b,el,apply:pp=>{el.style.opacity=pp;if(o.pop){const s=1+(1-eout(pp))*o.pop;el.style.transform=(o.base||'')+` scale(${s})`}}})}
  fn(a,b,f){return this.op({a,b,apply:f})}
  tick(f){return this.op({a:-99,b:99,raw:true,apply:f})}
  update(u){
    let best=null;
    for(const o of this.ops){const pp=prog(u,o.a,o.b);if(o.raw){o.apply(u);continue}o.apply(pp);
      if(o.tip&&u>=o.a&&u<=o.b+0.06&&(!best||o.a>=best.a))best=o}
    return best?best.tip(prog(u,best.a,best.b)):null;
  }
}

// paper gradient defs
let _defs=false;function addDefs(svg){if(_defs)return;_defs=true;document.getElementById('gdefs').insertAdjacentHTML('afterbegin',`<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset=".55" stop-color="#f7f4ee"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e6b3"/><stop offset="1" stop-color="#efdc9c"/></linearGradient>
<linearGradient id="yel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c32a"/><stop offset="1" stop-color="#ecb421"/></linearGradient></defs>`)}

// ---------- robot ----------
function robot(ctx,tx,ty,sc,a0,o={}){
  const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);ctx.svg.appendChild(g);
  const xf=q=>[tx+q.x*sc,ty+q.y*sc];
  const w=3.4/Math.max(sc,1)*Math.min(sc,1.25);
  const P=(d,a,b,pen=false)=>ctx.path(d,a0+a,a0+b,{parent:g,w:3.3,pen,xf});
  const fills=[];
  const F=(tag,at,a,b)=>{const s=ctx.shape(tag,at,a0+a,a0+b,g);return s};
  // fills under strokes
  F('rect',{x:30,y:58,width:140,height:100,rx:14,fill:'#f7f5f0'},0.25,0.45);
  F('rect',{x:50,y:166,width:100,height:82,rx:12,fill:'#f7f5f0'},0.52,0.68);
  P(rrect(30,58,140,100,14,7,1),0,0.32);
  P('M88 58 L100 24 L112 58',0.28,0.42);
  F('circle',{cx:100,cy:16,r:9,fill:'#f2b21b',stroke:INK,'stroke-width':3},0.38,0.48);
  P('M100 158 L100 167',0.36,0.4);
  P(rrect(50,166,100,82,12,9,1),0.36,0.6);
  F('circle',{cx:100,cy:207,r:15,fill:'#f2b21b',stroke:INK,'stroke-width':3.2},0.55,0.66);
  P('M50 190 C30 198 22 220 24 242',0.56,0.7);
  const lh=F('circle',{cx:24,cy:249,r:7,fill:'#fff',stroke:INK,'stroke-width':3},0.66,0.72);
  const armR=document.createElementNS(NS,'g');g.appendChild(armR);
  ctx.path('M150 190 C170 198 178 220 176 242',a0+0.56,a0+0.7,{parent:armR,w:3.3,pen:false});
  ctx.shape('circle',{cx:176,cy:249,r:7,fill:'#fff',stroke:INK,'stroke-width':3},a0+0.66,a0+0.72,armR);
  P('M80 248 L80 290 L62 290',0.6,0.78);P('M120 248 L120 290 L138 290',0.62,0.8);
  // face
  const face=document.createElementNS(NS,'g');g.appendChild(face);
  const eyes=document.createElementNS(NS,'g');eyes.innerHTML=`<circle cx="72" cy="104" r="7" fill="${INK}"/><circle cx="128" cy="104" r="7" fill="${INK}"/>`;
  const happy=document.createElementNS(NS,'g');happy.innerHTML=`<path d="M60 112 L72 98 L84 112 M116 112 L128 98 L140 112" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  face.innerHTML=`<ellipse cx="52" cy="124" rx="11" ry="6" fill="#f5c842" opacity=".9"/><ellipse cx="148" cy="124" rx="11" ry="6" fill="#f5c842" opacity=".9"/><path d="M80 122 Q100 140 120 122" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/>`;
  face.appendChild(eyes);face.appendChild(happy);
  const hu=o.happy??99, wave=o.wave||[];
  ctx.fn(a0,a0+0.01,()=>{});
  ctx.op({a:a0+0.75,b:a0+0.95,apply:pp=>{face.style.opacity=pp}});
  ctx.op({a:-99,b:99,apply:()=>{}});
  return {g,face,eyes,happy,armR,update(u){ // u local scene time
      const h=u>=hu;eyes.style.display=h?'none':'';happy.style.display=h?'':'none';
      let ang=0;for(const [a,b,amp] of wave){if(u>=a){const k=prog(u,a,a+0.35);ang=-105*eout(k)+(k>=1?Math.sin((u-a-0.35)*7)*amp:0);if(b&&u>b){const k2=prog(u,b,b+0.3);ang*=1-k2}}}
      armR.setAttribute('transform',`rotate(${ang} 150 190)`);
      // idle bob
      const bob=Math.sin(u*2.4)*2.2;g.setAttribute('transform',`translate(${tx} ${ty+bob}) scale(${sc})`);
    }};
}

// header: badge + title + subtitle; returns end time of title
function header(ctx,n,title,sub){
  ctx.svg.insertAdjacentHTML('beforeend',`<circle cx="180" cy="153" r="44" fill="#e7a917" opacity="0" id="bsh"/>`);
  const sh=ctx.svg.lastChild;
  ctx.op({a:0.1,b:0.25,apply:pp=>{sh.style.opacity=pp}});
  ctx.path(ellipsePath(185,148,45,45,1.05,n*3),-0.15,0.2,{w:4.2});
  const num=ctx.text(String(n),185,n>=10?122:118,'bold',0.12,0.25,{size:n>=10?52:62,center:true,pen:false,style:{transform:'rotate(-6deg)'}});
  const tl=title.length*0.026;
  ctx.text(title,268,92,'title',0.08,0.08+tl);
  ctx.text(sub,268,206,'sub',0.12+tl,0.42+tl,{pen:false});
  return 0.08+tl;
}

// ---------- SCENE TIMING ----------
const PERIOD=4.5, S1=4.05;
const ST=k=>S1+PERIOD*(k-1); // k=1..10, end card k=11
const sceneDefs=[];

// ===== INTRO =====
makeScene(0,ST(1),ctx=>{
  addDefs(ctx.svg);
  const r=robot(ctx,320,378,1.5,0,{happy:99,wave:[[2.45,0,10]]});
  ctx.text('Launch your brand',705,352,'title',0.55,1.42,{size:106});
  ctx.hl(1198,555,442,74,2.05,2.25,-1);
  ctx.text('with your <span style="position:relative">AI team</span>',705,497,'title',1.45,2.05,{size:106});
  ctx.text('10 steps, one chat',708,660,'sub',2.4,2.8,{size:46,pen:false});
  ctx.path(rline(1082,690,1250,688,4)+' M1236 680 L1252 688 L1236 696',2.8,3.3,{w:3,pen:false});
  ctx.tick(u=>r.update(u));
});

// ===== 1 PM =====
makeScene(ST(1),ST(2),ctx=>{
  addDefs(ctx.svg);
  header(ctx,1,'Tell the Project Manager your goal','Type it once, in one chat.');
  const r=robot(ctx,194,494,1.36,0.05,{happy:2.95});
  ctx.text('Project Manager',330,912,'lbl',0.9,1.1,{center:true,pen:false});
  ctx.frame(640,328,1160,642,0.15,0.85,{seed:11});
  ctx.path(rline(642,404,1798,404,12),0.6,0.85,{pen:false});
  [683,715,747].forEach((x,i)=>ctx.path(ellipsePath(x,368,12,12,1.05,i+20),0.7+i*0.05,0.82+i*0.05,{w:3,pen:false}));
  ctx.text('AIMY chat',800,345,'sub',0.85,1.0,{size:36,pen:false});
  ctx.frame(1095,440,665,85,1.0,1.25,{r:40,fill:'url(#yel)',seed:13});
  ctx.text('Launch my fitness brand, VYRA.',1125,450,'hand',1.15,1.8,{size:42});
  ctx.frame(680,558,702,384,1.85,2.1,{r:26,seed:14});

  const items=['Market + Funnel','Logo, Brand Kit, Portrait','Website + Videos','SNS posts + covers','Ads (after your OK)'];
  items.forEach((s,i)=>{const y=640+i*54;
    ctx.path(rrect(718,y+12,34,34,5,30+i,0.8),2.25+0.16*i,2.33+0.16*i,{w:3,pen:false});
    ctx.text(s,772,y-4,'hand',2.28+0.16*i,2.41+0.16*i,{size:36});
    ctx.path(`M722 ${y+30} L735 ${y+44} L760 ${y+2}`,2.8+0.14*i,2.9+0.14*i,{w:3.4});
  });
  ctx.path(ellipsePath(1530,904,14,14,1.05,40),3.42,3.55,{w:3});
  ctx.path('M1523 905 L1529 912 L1538 897',3.5,3.58,{w:3,pen:false});
  ctx.text('Plan ready',1555,878,'bold',3.52,3.85,{size:36});
  ctx.tick(u=>r.update(u));
});

// ===== 2 MARKET =====
makeScene(ST(2),ST(3),ctx=>{
  addDefs(ctx.svg);
  header(ctx,2,'Market Analysis studies rivals','Who sells what, and where VYRA can win.');
  const r=robot(ctx,90,648,0.99,0.05,{happy:2.9});
  ctx.text('Market Analysis',190,952,'lbl',0.9,1.1,{center:true,pen:false});

// ---------- seek ----------
function seek(t){
  let pen=null;
  for(let i=0;i<scenes.length;i++){const s=scenes[i];
    const vis=t>=s.S-0.28&&t<s.E+0.12;s.el.style.display=vis?'block':'none';if(!vis)continue;
    const ex=prog(t,s.E-0.3,s.E+0.02);const en=i==0?1:eout(prog(t,s.S-0.28,s.S+0.06));const off=-2300*ex*ex+620*(1-en);s.el.style.transform=`translateX(${off}px)`;
    const tip=s.ctx.update(t-s.S);
    if(tip&&ex<=0)pen=[tip[0]+off,tip[1]];
  }
  if(pen){pencilEl.style.display='block';pencilEl.style.transform=`translate(${pen[0]-3}px,${pen[1]-30}px) rotate(-33deg) translate(0,0)`;
    pencilEl.style.transformOrigin='3px 30px';}
  else pencilEl.style.display='none';
}
window.seek=seek;
