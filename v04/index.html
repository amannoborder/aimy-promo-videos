<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
.sc{position:absolute;inset:0;opacity:0;will-change:opacity,filter}
.abs{position:absolute}
.card{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);background:#fff}
.card img,.tile img{width:100%;height:100%;object-fit:cover;display:block}
.grad{background:linear-gradient(90deg,#f6b48e 0%,#ee93bd 45%,#b986ee 80%,#9f7cf2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{position:absolute;left:50%;transform:translateX(-50%);border:1.5px solid #6e2a1c;background:#140a08;border-radius:999px;color:#f3e7e1;font-weight:600;letter-spacing:.17em;font-size:20px;padding:10px 24px;white-space:nowrap;display:flex;align-items:center;gap:12px}
.pill .dot{width:9px;height:9px;border-radius:50%;background:#ff4a2a;box-shadow:0 0 10px #ff4a2a}
/* app panes */
.pane{position:absolute;left:0;top:0;width:900px;height:640px;background:linear-gradient(180deg,#fbfaff,#f1effa);color:#1b1b22;font-size:15px;overflow:hidden}
.pane .bar{height:34px;background:#f3f1fb;border-bottom:1px solid #e3e0ef;display:flex;align-items:center;padding:0 14px;font-size:12px;color:#55536a;gap:8px}
.pane .bar b{color:#222;font-weight:600}
.pane .bar .ctl{margin-left:auto;display:flex;gap:8px}.pane .bar .ctl i{width:10px;height:10px;border:1.5px solid #a9a6bb;border-radius:3px;display:block}
.pane .main{position:absolute;left:0;top:34px;width:610px;bottom:0;padding:18px 22px;overflow:hidden}
.pane .side{position:absolute;right:0;top:34px;width:290px;bottom:0;border-left:1px solid #e3e0ef;padding:16px 16px;background:#f8f7fd;overflow:hidden}
.pane h5{font-size:14px;font-weight:700;margin-bottom:10px;color:#1b1b22}
.q{border-bottom:1px solid #e6e3f1;padding:8px 0;font-size:12px;line-height:1.35;color:#333}
.q .tg{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:5px;margin-right:6px;background:#e7e4fb;color:#5a47c9}
.q .tg.s{background:#ddf3e4;color:#23874a}.q .tg.d{background:#fde7ef;color:#c03772}
.q .tm{float:right;color:#8b88a0;font-size:10px}
.cover{height:170px;border-radius:10px;overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.av{width:74px;height:74px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;overflow:hidden}
.av img{width:86%;object-fit:contain}
.post{border:1px solid #e6e3f1;border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff;font-size:13px;line-height:1.4}
.post .who{font-weight:700;font-size:12px}.post .who span{font-weight:400;color:#888}
.btn{display:inline-block;border:1px solid #d9d6e8;border-radius:7px;padding:4px 12px;font-size:12px;font-weight:600;background:#fff;margin-right:6px}
.line{height:8px;border-radius:4px;background:#e4e1ef;margin:7px 0}
.ig3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ig3 div{aspect-ratio:1/1;overflow:hidden;background:#ddd}.ig3 img{width:100%;height:100%;object-fit:cover}
.tk3 div{aspect-ratio:3/4}
.tile{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.fit{position:absolute;left:0;top:0;transform-origin:0 0}
</style></head>
<body><div id="stage"></div>
<script>
const P='../en-pack/';
const DUR=1788/30; window.DUR=DUR;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo2=x=>1-Math.pow(1-x,2);
const lerp=(a,b,x)=>a+(b-a)*x;
// in/out envelope: returns [opacity, blur]
function env(t,i0,i1,o0,o1,bl=18){const a=eo(lin(t,i0,i1)), b=o0==null?1:1-eio(lin(t,o0,o1));const v=Math.min(a,b);return [v,(1-v)*bl];}
function fx(el,o,b,tr){el.style.opacity=o;el.style.filter=b>0.05?`blur(${b.toFixed(2)}px)`:'none';if(tr!=null)el.style.transform=tr;el.style.visibility=o<=0.001?'hidden':'visible';}
const stage=document.getElementById('stage');
function scene(){const s=$('<div class="sc"></div>');stage.appendChild(s);return s;}
function add(par,html){const e=$(html);par.appendChild(e);return e;}
const img=(f,pos='center')=>`<img src="${P}${f}" style="object-position:${pos}">`;

/* ---------- app panes (English rebuilds) ---------- */
function queue(items){return items.map(([tg,c,txt,tm])=>`<div class="q"><span class="tg ${c}">${tg}</span><span class="tm">${tm}</span><br>${txt}</div>`).join('');}
const QX=[['Scheduled','s','Fifteen minutes, your living room. No commute.','Mon 07:30'],['Draft','d','Busy day? Start with one set of squats.','Mon 12:10'],['Scheduled','s','New: the 15-minute home program for busy professionals.','Tue 08:00'],['Draft','d','Small moves, every day. That is the whole plan.','Tue 19:00'],['Scheduled','s','Stretch break: three moves before your next meeting.','Wed 15:00'],['Draft','d','Start your fitness habit today. #VYRA','Thu 07:30'],['Scheduled','s','Move at home. Fit into your life.','Fri 18:00']];
function pane(kind){
  const bars={x:'X post · VYRA Fitness Minutes at Home',ig:'Instagram post · VYRA training with intent',th:'Threads post · VYRA Fitness Minutes at Home',tk:'TikTok post · VYRA Fitness Minutes at Home',fb:'Facebook post · VYRA Facebook Page',ss:'Substack article · Staying focused while working from home',an:'Analytics report · VYRA',mt:'Meeting note · Launch kickoff',ca:'Competitor ads · Home fitness',th2:'Thumbnail studio · YouTube'};
  let main='',side=`<h5>Post queue</h5>${queue(QX)}`;
  const vy=`<div class="av"><img src="${P}vyra-logo-en.png"></div>`;
  if(kind==='x'){main=`<div class="cover">${img('girl-cover-1.png')}</div>
   <div style="display:flex;align-items:flex-end;gap:12px;margin-top:-30px;padding-left:14px">${vy}<div style="margin-left:auto"><span class="btn">Edit profile</span></div></div>
   <div style="font-weight:800;font-size:18px;margin-top:6px">VYRA Fitness</div><div style="color:#777;font-size:12px">@vyrafit · Home fitness for busy days</div>
   <div class="post"><div class="who">VYRA Fitness <span>@vyrafit · 2h</span></div>Fifteen minutes. Your living room. No commute, no gym, just a routine you can start this week. #VYRA</div>
   <div class="post"><div class="who">VYRA Fitness <span>@vyrafit · 5h</span></div>Busy day? Start with one set of squats. The rest follows.</div>
   <div class="post"><div class="who">VYRA Fitness <span>@vyrafit · 1d</span></div>New: the 15-minute home program, built for busy professionals.</div>`;}
  if(kind==='ig'){main=`<div style="display:flex;gap:18px;align-items:center">${vy}<div><div style="font-weight:700;font-size:16px">vyra.fitness</div><div style="font-size:12px;color:#666;margin-top:4px">Move at home. Fit into your life.</div><div style="margin-top:8px"><span class="btn">Edit profile</span><span class="btn">Share profile</span></div></div></div>
   <div class="ig3" style="margin-top:16px">${['ad-en-vyra-girl.jpg','thumb-en-2.jpg','girl-pose-1.jpg','tiktok-en-squat.jpg','girl-pose-3.jpg','brand-hero-en.jpg','07-model-photo-4.jpg','thumb-en-1.jpg','girl-pose-2.jpg'].map(f=>`<div>${img(f,'center top')}</div>`).join('')}</div>`;}
  if(kind==='th'){main=`<div style="display:flex;gap:14px;align-items:center"><div><div style="font-weight:800;font-size:18px">Account</div><div style="font-size:12px;color:#777">vyra.fitness</div></div><div style="margin-left:auto">${vy}</div></div>
   <div style="margin:10px 0"><span class="btn">Edit profile</span><span class="btn">Share profile</span></div>
   <div style="font-size:12px;color:#666;border-bottom:1px solid #e6e3f1;padding-bottom:6px">Threads &nbsp; Replies &nbsp; Media &nbsp; Reposts</div>
   <div class="post"><div class="who">vyra.fitness <span>· 2h</span></div>You don't need an hour at the gym. Fifteen minutes at home between meetings is enough to start.
   <div style="width:250px;height:260px;border-radius:10px;overflow:hidden;margin-top:8px">${img('02-portrait.jpg','center 20%')}</div></div>`;}
  if(kind==='tk'){main=`<div style="text-align:center"><div style="font-weight:700">vyra.fitness</div><div style="display:flex;justify-content:center;margin:8px 0">${vy}</div><div style="font-size:12px;color:#666">@vyra.fitness</div><div style="margin:8px 0"><span class="btn">Edit profile</span><span class="btn">Share profile</span></div></div>
   <div class="ig3 tk3">${['tiktok-en-squat.jpg','girl-pose-4.jpg','girl-pose-1.jpg','girl-pose-3.jpg','07-model-photo-2.jpg','girl-pose-2.jpg'].map(f=>`<div>${img(f,'center top')}</div>`).join('')}</div>`;}
  if(kind==='fb'){main=`<div style="color:#1877f2;font-weight:800;font-size:16px;margin-bottom:6px">facebook</div><div class="cover" style="height:180px">${img('cover-en-move-your-city.jpg')}</div>
   <div style="display:flex;align-items:flex-end;gap:12px;margin-top:-26px;padding-left:14px">${vy}<div><div style="font-weight:800;font-size:18px">VYRA</div><div style="font-size:12px;color:#777">Home fitness brand · Page</div></div></div>
   <div style="font-size:12px;color:#666;margin-top:8px;border-bottom:1px solid #e6e3f1;padding-bottom:6px">Posts &nbsp; About &nbsp; Followers &nbsp; Photos</div>
   <div class="post"><div class="who">VYRA <span>· Just now</span></div>Fit for a brighter tomorrow. Short home workouts built for people with full workdays. No commute, no gym.</div>`;}
  if(kind==='ss'){main=`<div style="font-weight:800;font-size:22px;line-height:1.2">Staying focused while working from home</div><div style="color:#777;font-size:12px;margin:6px 0 12px">VYRA · 6 min read</div>
   <p style="font-size:13px;line-height:1.6;color:#333">Working from home removes the commute, but it also removes the edges of the day. The kitchen is close, the phone is within reach, and the hours blur. A fifteen-minute routine gives the day a clear start and a clear stop.</p>
   <div style="font-weight:700;margin:12px 0 4px">Give your day a clear first task</div><div class="line"></div><div class="line" style="width:90%"></div><div class="line" style="width:70%"></div>
   <div style="font-weight:700;margin:12px 0 4px">Work in short, fixed blocks</div><div class="line"></div><div class="line" style="width:85%"></div><div class="line" style="width:60%"></div>`;
   side=`<h5>Outline</h5>${['Give your day a clear first task','Work in short, fixed blocks','Close the doors you can close','Review the day in two minutes'].map(s=>`<div class="q">${s}</div>`).join('')}`;}
  if(kind==='an'){main=`<div style="font-weight:800;font-size:20px">Social overview</div><div style="font-size:12px;color:#777;margin-bottom:12px">All connected channels · this week</div>
   <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">${['Posts published','Scheduled','Drafts'].map(s=>`<div class="post" style="margin:0"><div style="font-size:11px;color:#777">${s}</div><div class="line" style="width:50%;height:14px;background:#cfc9ef"></div></div>`).join('')}</div>
   <div class="post"><div style="font-size:12px;font-weight:700">Posts by platform</div><div style="display:flex;gap:18px;align-items:center;margin-top:8px"><div style="width:90px;height:90px;border-radius:50%;background:conic-gradient(#8b74f0 0 38%,#ee93bd 0 64%,#f6b48e 0 82%,#dcd8ef 0)"></div><div style="flex:1">${['X','Instagram','Threads','TikTok'].map(s=>`<div style="font-size:12px;margin:4px 0">${s}<div class="line" style="margin:2px 0"></div></div>`).join('')}</div></div></div>`;
   side=`<h5>Notes</h5>${['Instagram drafts ready for review','X schedule set for the week','Threads posts follow the same plan','Ads wait for your approval'].map(s=>`<div class="q">${s}</div>`).join('')}`;}
  if(kind==='mt'){main=`<div style="font-weight:800;font-size:20px">Meeting note</div><div style="font-size:12px;color:#777;margin-bottom:10px">Launch kickoff · VYRA</div>
   <div style="font-weight:700;margin-top:6px">Agenda</div><ol style="font-size:13px;line-height:1.7;padding-left:18px;color:#333"><li>Confirm the launch plan and the order of work</li><li>Pick one logo from the nine ideas</li><li>Review the brand board and the landing page</li><li>Approve the first two ads before any spend</li></ol>
   <div style="font-weight:700;margin-top:10px">Decided</div><div class="line"></div><div class="line" style="width:80%"></div><div style="font-weight:700;margin-top:10px">Next</div><div class="line" style="width:90%"></div><div class="line" style="width:55%"></div>`;
   side=`<h5>Action items</h5>${['Logo · pick one idea','Brand Kit · final colours','Website · publish draft','Ads · approve or edit'].map(s=>`<div class="q"><span class="tg">To do</span>${s}</div>`).join('')}`;}
  if(kind==='ca'){main=`<div style="font-weight:800;font-size:20px">Competitor ads</div><div style="font-size:12px;color:#777;margin-bottom:10px">Home fitness · longest running first</div>
   ${['Studio brand A','Online coach B','Fitness app C','Yoga studio D'].map(s=>`<div class="post"><div class="who">${s} <span>· Active</span></div><div class="line"></div><div class="line" style="width:70%"></div></div>`).join('')}`;
   side=`<h5>Patterns</h5>${['Short routines lead the copy','Morning and lunch-break angles','Real people, home settings'].map(s=>`<div class="q">${s}</div>`).join('')}`;}
  if(kind==='th2'){main=`<div class="post" style="margin-top:0;font-size:12px;color:#444"><b>Request:</b> YouTube thumbnail, 16:9, for the fitness brand VYRA. A young woman doing a quick full-body home workout in a bright room, energetic and smiling. Big, bold, clean English headline.</div>
   <div style="height:310px;border-radius:10px;overflow:hidden;margin-top:12px">${img('thumb-en-1.jpg')}</div>`;
   side=`<h5>Thumbnails</h5>${['Thumbnail 1 · Move First','Thumbnail 2 · Move at Home','Thumbnail 3 · Busy Routine','Thumbnail 4 · draft','Thumbnail 5 · draft'].map(s=>`<div class="q">${s}</div>`).join('')}`;}
  return `<div class="pane"><div class="bar"><b>${bars[kind].split(' · ')[0]}</b> · ${bars[kind].split(' · ').slice(1).join(' · ')}<span class="ctl"><i></i><i></i></span></div><div class="main">${main}</div><div class="side">${side}</div></div>`;
}
// a tile: image or pane, fitted to w x h
function tileHTML(c,w,h,extra=''){
  if(c.startsWith('pane:')){const s=Math.max(w/900,h/640);return `<div class="tile" style="width:${w}px;height:${h}px;${extra}"><div class="fit" style="transform:scale(${s})">${pane(c.slice(5))}</div></div>`;}
  if(c.startsWith('dark:')){return `<div class="tile" style="width:${w}px;height:${h}px;background:radial-gradient(ellipse at 50% 45%,#2a2a30,#0b0b0e 75%);${extra}"><img src="${P}${c.slice(5)}" style="width:86%;height:auto;object-fit:contain;position:absolute;left:7%;top:50%;transform:translateY(-50%)"></div>`;}
  if(c.startsWith('phone:')){return `<div class="tile" style="width:${w}px;height:${h}px;background:#111;${extra}"><div style="position:absolute;left:14%;top:6%;width:72%;height:120%;border-radius:40px;border:8px solid #2b2b30;overflow:hidden;background:#000">${img(c.slice(6),'center top')}</div></div>`;}
  const [f,pos]=c.split('@');return `<div class="tile" style="width:${w}px;height:${h}px;${extra}">${img(f,pos||'center')}</div>`;
}

/* =============== S1 opening wall 0–3.45 =============== */

const wall=add(S1,`<div class="abs" style="left:-700px;top:-650px;width:3300px;height:2400px;transform-style:preserve-3d"></div>`);
const wallItems=['ad-en-vyra-girl.jpg','pane:x','brand-hero-en.jpg','thumb-en-1.jpg','pane:ig','girl-cover-2.png@70% center','website-hero-en.jpg',
 'logo-sheet-nine-en.png','pane:fb','phone:lp-phone-screen-en.jpg','banner-en.jpg@20% center','02-portrait.jpg@center 25%','pane:mt','thumb-en-2.jpg',
 'pane:an','brandboard-en.jpg@center top','ad-en-busy-routine.jpg','pane:th','girl-cover-1.png@30% center','tiktok-en-squat.jpg@center 30%','cover-en-move-your-city.jpg@60% center',
 'thumb-en-3.jpg','dark:vyra-logo-en.png','pane:ss','07-model-photo-1.jpg','pane:tk','lp-tall-en.jpg@center top','view-list-photos.jpg',
 'girl-pose-4.jpg@center 20%','pane:ca','sns-cover-concepts-en-ui.jpg@center 10%','ad-en-vyra-girl.jpg@center 20%','pane:x','website-hero-en.jpg@70% center','girl-cover-3.png@40% center'];
{let k=0;for(let r=0;r<6;r++)for(let c=0;c<7;c++){const it=wallItems[(k++)%wallItems.length];const x=c*460+(r%2)*120,y=r*380;wall.insertAdjacentHTML('beforeend',tileHTML(it,430,350,`left:${x}px;top:${y}px;border-radius:22px`));}}

const p2=add(S2,`<div class="pill" style="top:150px">AIMY · ONE CHAT</div>`);
const words2=[['THE',0],['AI',1],['EMPLOYEES',1],['YOUR',2],['BUSINESS',2],['IS',2],['MISSING.',2]];

w2[1].style.background='linear-gradient(90deg,#f6b48e,#f2a6a6)';w2[1].style.webkitBackgroundClip='text';
w2[2].style.background='linear-gradient(90deg,#f0a3ad,#e990c3 40%,#b98aee 100%)';w2[2].style.webkitBackgroundClip='text';

const strip=add(S2,`<div class="abs" style="left:0;top:740px;height:330px;width:6000px"></div>`);
['pane:x','brandboard-en.jpg@center 2%','ad-en-vyra-girl.jpg@center 15%','pane:ig','website-hero-en.jpg','thumb-en-2.jpg','pane:fb','girl-cover-2.png@35% center','pane:th','brand-hero-en.jpg','pane:tk','thumb-en-1.jpg','pane:x','brandboard-en.jpg@center 2%'].forEach((c,i)=>strip.insertAdjacentHTML('beforeend',tileHTML(c,408,330,`left:${i*430}px;top:0;border-radius:12px`)));

/* =============== S3 chat 7.15–12.75 =============== */
const S3=scene();
const c3a=add(S3,`<div class="abs" style="left:110px;top:440px;font-size:66px;font-weight:700;letter-spacing:-.035em">One chat.</div>`);

const win3=add(S3,`<div class="abs" style="left:790px;top:200px;width:1010px;height:560px;background:#0c0c0d;border:1px solid #232326;border-radius:18px">
 <div style="height:46px;border-bottom:1px solid #1d1d20;display:flex;align-items:center;padding:0 18px;gap:9px"><i style="width:13px;height:13px;border-radius:50%;background:#ff5f57;display:block"></i><i style="width:13px;height:13px;border-radius:50%;background:#febc2e;display:block"></i><i style="width:13px;height:13px;border-radius:50%;background:#28c840;display:block"></i><span style="position:absolute;left:0;right:0;text-align:center;color:#8a8a90;font-size:15px">AIMY — chat</span></div></div>`);
const typed=add(win3,`<div class="abs" style="left:34px;top:80px;font-size:22px;color:#e9e9ec"></div>`);
