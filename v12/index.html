function hermite(arr,t,get){
  let i=0; while(i<arr.length-2 && t>arr[i+1].t) i++;
  const a=arr[i],b=arr[i+1]; const h=b.t-a.t; let u=clamp((t-a.t)/h);
  const prev=arr[Math.max(0,i-1)], next=arr[Math.min(arr.length-1,i+2)];
  const va=get(a), vb=get(b), vp=get(prev), vn=get(next);
  const out=[];
  for(let k=0;k<va.length;k++){
    let ma=(i===0)?0:(vb[k]-vp[k])/(b.t-prev.t); let mb=(i+2>=arr.length)?0:(vn[k]-va[k])/(next.t-a.t);
    // damp tangents when segment direction disagrees (avoid overshoot)
    const sl=(vb[k]-va[k])/h; if(ma*sl<=0)ma=0; if(mb*sl<=0)mb=0; ma=Math.max(-3*Math.abs(sl),Math.min(3*Math.abs(sl),ma)); mb=Math.max(-3*Math.abs(sl),Math.min(3*Math.abs(sl),mb));
    const u2=u*u,u3=u2*u;
    out.push((2*u3-3*u2+1)*va[k]+(u3-2*u2+u)*h*ma+(-2*u3+3*u2)*vb[k]+(u3-u2)*h*mb);
  }
  return out;
}
function camAt(t){const p=hermite(K,t,k=>k.p),l=hermite(K,t,k=>k.l),f=hermite(K,t,k=>[k.f])[0];return {p,l,f};}

 <div class="cbox"><span class="txt"></span><span class="send"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div></div>`);

 <h2>3 ad drafts are ready for VYRA</h2>
 <div class="th"><img src="../en-pack/ad-en-vyra-girl.jpg" style="width:150px"><img src="../en-pack/ad-en-busy-routine.jpg" style="width:150px"><img src="../en-pack/banner-en.jpg" style="width:260px;object-position:15% 50%"></div>
 <div class="row"><span>Spend</span><b class="sp"></b></div>

const end=el('<div class="end"><img src="../en-pack/aimy-logo-dark.png" alt="AIMY"><div class="l1">A company of AI employees in one chat.</div><div class="l2">52 AI employees · One chat · You approve what matters</div></div>');
const endImg=end.querySelector('img');

const CAPS=[
 [5.5,10.0,'Every employee has a desk.','They work in a <span class="a">fixed order.</span>'],
 [10.1,15.4,'Strategy first.','Plan · Counseling · <span class="a">Market</span>'],
 [15.6,18.45,'Logo drafts nine ideas.','<span class="a">You pick one.</span>'],
 [18.6,21.9,'Then Brand Kit, Portrait','and <span class="a">Website.</span>'],
 [22.1,30.3,'Video, thumbnails,','<span class="a">every social channel.</span>'],
 [36.6,43.6,'Nothing spends','<span class="a">until you approve.</span>'],
 [43.9,47.4,'52 AI employees.','<span class="a">One chat.</span>'],
];
let capKey='';
function setHTML(e,h){if(e._h!==h){e.innerHTML=h;e._h=h;}}
const v3=new T.Vector3();

window.seek=function(t){
  if(!fontsReady && document.fonts && document.fonts.check('800 30px Inter')) fontsReady=true;
  if(!drawnStatic && imgLeft===0){ DESKS.forEach(d=>drawDesk(d,t)); drawnStatic=true; for(const L of LABELS){} }
  if(drawnStatic && fontsReady && !window._redrawn){ DESKS.forEach(d=>drawDesk(d,t)); relabel(); window._redrawn=true; }
  if(drawnStatic) for(const k in ANIM){ const d=DESKS[k]; if(k==5 && (t<15 || t>19.5)) { if(d._lt!=='x'+(t>19.5)){drawDesk(d,t);d._lt='x'+(t>19.5);} continue; } if(k==19 && Math.abs(t-41.1)>3 && d._lt===(t>41.1)) continue; drawDesk(d,t); d._lt=(t>41.1); }
  // camera
  const c=camAt(t); cam.position.set(...c.p); cam.lookAt(...c.l); cam.fov=c.f; cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  // robots
  DESKS.forEach((d,i)=>{const st=status(i,t); d.bulbM.color.set(STC[st]); const ph=i*1.7;
    d.head.rotation.y=Math.sin(t*0.8+ph)*0.12; d.head.rotation.x=0.12+Math.sin(t*1.3+ph)*0.03;
    if(st==='working'){ d.aL.rotation.set(-1.15+Math.sin(t*15+ph)*0.09,0,0.12); d.aR.rotation.set(-1.15+Math.sin(t*15+ph+1.6)*0.09,0,-0.12); d.rb.position.y=0.55; }
    else if(st==='done'){ d.aL.rotation.set(-0.95,0,0.18); d.aR.rotation.set(-0.95,0,-0.18); d.head.rotation.x=-0.08; d.rb.position.y=0.55+Math.abs(Math.sin(t*3+ph))*0.012; }
    else { d.aL.rotation.set(-1.1,0,0.12); d.aR.rotation.set(0,0,2.6+Math.sin(t*7)*0.25); d.head.rotation.x=-0.15; d.rb.position.y=0.56+Math.abs(Math.sin(t*7))*0.02; }
  });
  R.render(scene,cam);

  // chips
  const camY=c.p[1]; const over=ss(6,10,camY);
  DESKS.forEach((d,i)=>{const e=chips[i]; const r=d.r; const st=status(i,t);
    v3.set(r.x,2.35,r.z-0.6).project(cam); const sx=(v3.x*0.5+0.5)*1920, sy=(-v3.y*0.5+0.5)*1080;
    const dist=Math.hypot(c.p[0]-r.x,c.p[1]-2.3,c.p[2]-(r.z-0.6));
    let a=Math.max(over, 1-ss(5.5,8.5,dist)); a*=ss(6.3+i*0.05,6.8+i*0.05,t); if(v3.z>1||v3.z<-1) a=0;
    if(t>47.6) a*=1-ss(47.6,48.2,t);
    // in the ads beat hide other chips
    if(t>35.6&&t<44&&i!==19) a*=1-ss(35.6,36.2,t)*(1-ss(43.3,43.9,t));
    if(a<0.02){e.style.opacity=0;return;}
    const sc=lerp(1.12,0.78,over)*(st==='needs'?1.25:1);
    const lbl=(i===19&&st==='done')?'Approved':LBL[st];
    setHTML(e,`<span class="ic">${ICON[st]}</span><span class="n">${r.n}</span>${r.name}<span class="st">· ${lbl}</span>`);
    e.className='chip '+st; e.style.opacity=a;
    const w=e.offsetWidth; const edge=ss(10,50,sx-w*sc/2)*ss(10,50,1920-(sx+w*sc/2))*ss(10,40,sy-50*sc)*ss(10,40,1080-sy); if(edge<0.02){e.style.opacity=0;return;} e.style.opacity=a*edge; e.style.transform=`translate(${sx-w/2}px,${sy-50*sc}px) scale(${sc})`;
    e.style.zIndex=Math.round(1000-dist*10);
  });

  // title + composer (intro)
  const tA=fade(t,0.3,5.6,0.5);
  title.style.opacity=tA; wash.style.opacity=tA; setHTML(title,'A company of AI employees<br><span class="a">in one chat.</span>');
  title.style.transform=`translateY(${(1-ss(0.3,1.0,t))*24}px)`;
  const cA=fade(t,0.9,5.7,0.45); compose.style.opacity=cA; compose.style.transform=`translateY(${(1-ss(0.9,1.4,t))*30}px)`;
  const msg='Launch VYRA, our home-fitness brand.'; const nch=Math.floor(clamp((t-1.3)/1.5)*msg.length);
  const sent=t>3.15;
  setHTML(cTxt, sent?'<span class="ph">Message Amy…</span>':(nch?msg.slice(0,nch)+'<span class="caret"></span>':'<span class="ph">Message Amy…</span>'));
  cBubble.style.opacity=ss(3.15,3.4,t); cBubble.style.transform=`translateY(${(1-ss(3.15,3.5,t))*40 - ss(3.9,4.2,t)*84}px)`;
  cReply.style.opacity=ss(3.95,4.25,t); cReply.style.transform=`translateY(${(1-ss(3.95,4.3,t))*30}px)`;

  // captions
  let ck=''; let ca=0;
  for(const [a,b,l1,l2] of CAPS){ if(t>=a-0.05&&t<=b+0.05){ ck=l1+'<br>'+l2; ca=fade(t,a,b,0.3);} }
  setHTML(cap,ck); cap.style.opacity=ck?ca:0; cap.style.transform=`translateY(${(1-ca)*16}px)`;

  // desk card
  let di=-1; if(t>=9.9&&t<30.4){ let best=1e9; for(let i=0;i<19;i++){const dd=Math.abs(t-(i===5?16.95:ROSTER[i].c)); if(dd<best){best=dd;di=i;}} }
  if(t>=35.9&&t<43.6) di=19;
  if(di>=0){ const r=ROSTER[di]; desk.style.opacity=di===19?fade(t,35.9,43.6,0.3):fade(t,9.9,30.4,0.3);
    setHTML(desk.querySelector('.num'),r.n); desk.querySelector('.num').style.background=r.color;
    setHTML(desk.querySelector('.t1'),r.name); setHTML(desk.querySelector('.t2'),r.d); setHTML(desk.querySelector('.t3'),`Employee ${r.n} of 52`);
  } else desk.style.opacity=0;

  // legend (overview)
  const lA=fade(t,31.1,35.7,0.35); legend.style.opacity=lA;
  const hl=[[32.6,33.4],[33.45,34.3],[34.35,35.7]];
  legendChips.forEach((e,k)=>{const on=ss(hl[k][0],hl[k][0]+0.15,t)*(k<2?(1-ss(hl[k][1],hl[k][1]+0.15,t)):1); e.style.transform=`scale(${1+on*0.14})`; e.style.background=on>0.5?'#fff':'#f6f7f9'; e.style.boxShadow=on>0.5?'0 6px 20px rgba(20,26,46,.18)':'none'; e.style.opacity=0.55+0.45*Math.max(on, t<32.6?1:0);});

  // approval modal
  const mA=fade(t,37.0,43.6,0.4); modal.style.opacity=mA; modal.style.transform=`translateY(${(1-ss(37.0,37.5,t))*30}px)`;
  const ok=t>=41.1;
  setHTML(mTag, ok?'Approved':'Needs you'); mTag.style.background=ok?'#dcf5e4':'#ffe1d9'; mTag.style.color=ok?'#15803d':'#e4572e';
  setHTML(mSp, ok?'<span style="color:#15803d">Approved by you</span>':'<span style="color:#e4572e">Off until you approve</span>');
  setHTML(mAp, ok?'Approved ✓':'Approve'); mAp.style.background=ok?'#22c55e':'#141a2e'; mAp.style.color='#fff';
  const press=ss(40.95,41.05,t)*(1-ss(41.1,41.25,t)); mAp.style.transform=`scale(${1-press*0.06})`;
  // cursor path to Approve button
  const br=mAp.getBoundingClientRect(); const tx0=1500,ty0=1010; const tx1=br.left+br.width*0.55, ty1=br.top+br.height*0.55;
  const cu=ss(39.6,40.85,t); cursor.style.opacity=fade(t,39.3,42.4,0.3); cursor.style.transform=`translate(${lerp(tx0,tx1,cu)}px,${lerp(ty0,ty1,cu)}px) scale(${1-press*0.15})`;

  // end card
  const eA=ss(47.4,48.1,t); end.style.opacity=eA; endImg.style.transform=`scale(${0.94+0.06*ss(47.4,49.2,t)})`;
  end.querySelector('.l1').style.opacity=ss(48.4,48.9,t); end.querySelector('.l2').style.opacity=ss(49.0,49.5,t);
};
function relabel(){ /* floor labels drawn at init; redraw when fonts become ready */
  for(const L of LABELS){const x=L.tt.ctx,c=L.tt.canvas;x.clearRect(0,0,c.width,c.height);x.fillStyle=L.color;x.font='800 110px Inter, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(L.str,c.width/2,c.height/2+4);L.tt.tex.needsUpdate=true;}
}
window.seek(0);
})();
