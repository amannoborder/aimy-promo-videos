/* ======== TIMING (filled from the VO) ======== */
const TM=window.TM||{"intro":0,"b":[6.6,11.4,16.0,20.2,24.4,28.4,32.6,37.0,41.2],"fin":47.8,"end":51.3,"tap":45.3,"dur":58};
window.DUR=TM.dur;
const WX=90,WY=420; // window origin in world
/* ======== employees ======== */
const EMP=[
 {num:'01',name:'Project Manager',pill:[300,330],anc:[250,640],tag:'01 · PROJECT MANAGER',title:'Plans the launch.',sub:'Every employee, in a fixed order.',
  msg:'The VYRA launch plan is ready. Every employee, in order.',chip:'Launch plan',art:'Launch plan',pv:'plan'},
 {num:'13',name:'Logo',pill:[800,330],anc:[720,640],tag:'13 · LOGO',title:'Nine ideas.',sub:'You pick one.',
  msg:'Nine logo ideas. You picked one.',chip:'VYRA logo',art:'VYRA logo',pv:'vyra-logo-en.png'},
 {num:'14',name:'Brand Kit',pill:[195,770],anc:[330,880],tag:'14 · BRAND KIT',title:'The whole look.',sub:'Colors, type and photos.',
  msg:'Your brand board is ready.',chip:'Brand board',art:'Brand board',pv:'brandboard-en.jpg'},
 {num:'15',name:'Portrait',pill:[890,830],anc:[760,920],tag:'15 · PORTRAIT',title:'Selfie in.',sub:'Studio portrait out.',
  msg:'Studio portrait done from your selfie.',chip:'Studio portrait',art:'Studio portrait',pv:'02-portrait.jpg'},
 {num:'17',name:'Website',pill:[195,1090],anc:[330,1140],tag:'17 · WEBSITE',title:'The landing page.',sub:'Built in the same chat.',
  msg:'Landing page ready to preview.',chip:'Landing page',art:'Landing page',pv:'lp-tall-en.jpg'},
 {num:'21',name:'YouTube · Thumbnail',pill:[810,1160],anc:[720,1210],tag:'21 · 23 · YOUTUBE + THUMBNAIL',title:'The channel.',sub:'Banner, videos and thumbnails.',
  msg:'Channel set up. Three thumbnails.',chip:'YouTube channel',art:'YouTube channel',pv:'thumb-en-1.jpg'},
 {num:'24',name:'X · Instagram · TikTok',pill:[260,1410],anc:[330,1330],tag:'24 · 25 · 28 · SOCIAL',title:'Posts for every app.',sub:'Drafted for X, Instagram and TikTok.',
  msg:'Posts drafted for X, Instagram and TikTok.',chip:'Social posts',art:'Social posts',pv:'tiktok-en-squat.jpg'},
 {num:'35',name:'SNS Cover',pill:[860,1470],anc:[760,1420],tag:'35 · SNS COVER',title:'Every profile, dressed.',sub:'A cover for each channel.',
  msg:'Covers for every profile.',chip:'Profile covers',art:'Profile covers',pv:'girl-cover-1.png'},
 {num:'42',name:'Ads',pill:[540,1650],anc:[540,1490],tag:'42 · ADS',title:'The campaign.',sub:'Nothing spends until you approve.',
  msg:'Campaign drafted. Waiting for your approval.',chip:'Ad campaign',art:'Ad campaign',pv:'ad-en-vyra-girl.jpg'},
];
EMP.forEach((e,i)=>{e.t0=TM.b[i];e.t1=i<8?TM.b[i+1]:TM.fin});
/* ======== labels + leader lines ======== */
const labs=$('labs'),svg=$('lines');const NS='http://www.w3.org/2000/svg';
EMP.forEach((e,i)=>{
  e.lab=mk(labs,`<div class="av">${e.num}</div><span>${e.name}</span><div class="ok">✓</div>`,'lab');
  e.anE=mk(labs,'','anc');e.anE.style.left=e.anc[0]+'px';e.anE.style.top=e.anc[1]+'px';
  const l=document.createElementNS(NS,'line');l.setAttribute('stroke','#FF4B61');l.setAttribute('stroke-width','3');l.setAttribute('stroke-dasharray','2 9');l.setAttribute('stroke-linecap','round');svg.appendChild(l);e.line=l;
  e.pin=1.2+i*.16; SFX.push({t:e.pin,k:'pop',g:.35});
});
/* ======== artifact panel previews ======== */
const pbody=$('pbody');
const planMini=`<div style="padding:26px 26px;font-size:19px;font-weight:700"><div style="font-size:14px;letter-spacing:.14em;color:#FF4B61;font-weight:800">THE PLAN</div><div style="font-size:28px;font-weight:800;margin:4px 0 12px">VYRA launch</div>`+
 [['01','Project Manager'],['02','Counseling'],['05','Market Analysis'],['11','Knowledge'],['12','Funnel'],['13','Logo'],['14','Brand Kit'],['15','Portrait'],['17','Website'],['21','YouTube'],['23','Thumbnail'],['42','Ads']].map(r=>`<div style="display:flex;gap:12px;height:40px;align-items:center;border-top:1px solid #f0f0f3"><span style="width:30px;color:#a1a1a8">${r[0]}</span>${r[1]}</div>`).join('')+`</div>`;
EMP.forEach(e=>{
  let html='',css='';
  if(e.pv==='plan')html=planMini;
  else if(e.pv==='vyra-logo-en.png')css=`background:#fff url(${P}vyra-logo-en.png) center/80% no-repeat`;
  else if(e.pv==='lp-tall-en.jpg')css=`background:#fff url(${P}lp-tall-en.jpg) top/100% auto no-repeat`;
  else if(e.pv==='girl-cover-1.png')html=`<div style="position:absolute;left:0;right:0;top:0;height:134px;background:url(${P}girl-cover-1.png) center/cover"></div><div style="position:absolute;left:0;right:0;top:150px;height:134px;background:url(${P}cover-en-move-your-city.jpg) center/cover"></div><div style="position:absolute;left:0;right:0;top:300px;height:134px;background:url(${P}girl-cover-2.png) center/cover"></div><div style="position:absolute;left:0;right:0;top:450px;height:134px;background:url(${P}cover-en-fitness-1.jpg) center/cover"></div>`;
  else if(e.pv==='thumb-en-1.jpg')html=`<div style="position:absolute;left:0;right:0;top:0;height:132px;background:url(${P}cover-en-move-your-city.jpg) center/cover"></div><div style="position:absolute;left:14px;right:14px;top:150px;height:258px;border-radius:12px;background:url(${P}thumb-en-1.jpg) center/cover"></div><div style="position:absolute;left:14px;width:224px;top:424px;height:126px;border-radius:10px;background:url(${P}thumb-en-2.jpg) center/cover"></div><div style="position:absolute;right:14px;width:224px;top:424px;height:126px;border-radius:10px;background:url(${P}thumb-en-3.jpg) center/cover"></div>`;
  else css=`background-image:url(${P+e.pv});background-position:center 25%`;
  e.pvE=mk(pbody,html,'pv',css);e.pvC=mk(pbody,`${e.art} <span style="color:#a1a1a8">· by ${e.name}</span>`,'pcap');
});
/* ======== chat ======== */
const chat=$('chat');const MS=[];
function umsg(t,text,h){const el=mk(chat,`<div class="bub">${text}</div>`,'msg u');MS.push({t,el,h});SFX.push({t,k:'pop',g:.5})}
function emsg(t,e,h){const el=mk(chat,`<div class="av">${e.num}</div><div><div class="nm">${e.name}</div><div class="bub">${e.msg}<div class="chip"><span>◧</span>${e.chip}</div></div></div>`,'msg e');MS.push({t,el,h});SFX.push({t,k:'pop',g:.4})}
const TYPE='Launch my home-fitness brand, VYRA.';
const TSEND=2.9;
umsg(TSEND,TYPE,64);
EMP.forEach(e=>emsg(e.t1-.35,e,e.msg.length>34?140:120));
umsg(TM.tap+.05,'Approved.',56);
function chatAt(t){
  const AREA=880;let y=14,ys=[];
  for(const m of MS){const p=eo(cl((t-m.t)/.35));ys.push(y);y+=(m.h+12)*p}
  const scroll=Math.max(0,y-AREA+8);
  MS.forEach((m,i)=>{const p=cl((t-m.t)/.35);if(p<=0){m.el.style.display='none';return}
    m.el.style.display='';const e=eo(p);
    m.el.style.transform=`translateY(${ys[i]-scroll+20*(1-e)}px) scale(${.94+.06*e})`;m.el.style.opacity=e;
    m.el.style.transformOrigin=m.el.classList.contains('u')?'100% 100%':'0 100%'});
}
/* ======== big expanded cards (screen space) ======== */
const xin=$('xin');
const head=(e,desc)=>`<div class="xh"><div class="av">${e.num}</div><div><div class="nm">${e.name}</div><div class="ds">${desc}</div></div><div class="dn">Delivered</div></div>`;
const CARD=[];

// 0 PM
const ROST=[['01','Project Manager'],['02','Counseling'],['05','Market Analysis'],['11','Knowledge'],['12','Funnel'],['13','Logo'],['14','Brand Kit'],['15','Portrait'],['17','Website'],['21','YouTube'],['22','Long Video'],['23','Thumbnail'],['24','X'],['25','Instagram'],['28','TikTok'],['35','SNS Cover'],['42','Ads']];
card(0,'VYRA launch · plan',`<div style="font-size:22px;font-weight:800;letter-spacing:.14em;color:#FF4B61">THE PLAN</div><div style="font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0 18px">Launch VYRA, in order.</div>`+
 ROST.map(r=>`<div class="pr" style="display:flex;align-items:center;gap:18px;height:50px;font-size:26px;font-weight:600;border-top:1px solid #f0f0f3"><span style="width:44px;color:#a1a1a8;font-weight:700">${r[0]}</span><span style="flex:1">${r[1]}</span><span class="ck" style="width:32px;height:32px;border-radius:50%;background:#22c55e;color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center">✓</span></div>`).join('')+
 `<div style="font-size:22px;font-weight:600;color:#a1a1a8;padding-top:12px">…and the rest of the 52 AI employees</div>`,
 (t,el,e)=>{el.querySelectorAll('.pr').forEach((r,k)=>{const p=cl((t-e.t0-.9-k*.12)/.25);r.style.opacity=.2+.8*p;r.querySelector('.ck').style.transform=`scale(${eb(p)})`})});
// 1 Logo
let lg='';for(let k=0;k<9;k++){const c=k%3,r=Math.floor(k/3);lg+=`<div class="lc" style="position:absolute;left:${c*290}px;top:${r*250}px;width:270px;height:230px;border-radius:18px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.07),0 0 0 1px #eee;overflow:hidden"><div style="position:absolute;inset:8px;background:url(${P}logo-sheet-nine-en.png) no-repeat;background-size:300% 300%;background-position:${c*50}% ${[14,50,86][r]}%"></div></div>`}
card(1,'Nine ideas · you pick one',`<div style="position:absolute;left:0;top:0;width:860px;height:740px">${lg}<div class="ring" style="position:absolute;left:286px;top:246px;width:278px;height:238px;border-radius:22px;border:6px solid #FF4B61"></div><div class="tap" style="position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(30,30,40,.3);border:4px solid #fff"></div></div>
 <div class="ph0" style="position:absolute;left:0;right:0;top:770px;height:300px;border-radius:24px;border:3px dashed #d9d9e0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#a1a1a8">Tap the one you like</div><div class="pk" style="position:absolute;left:0;right:0;top:770px;height:300px;border-radius:24px;background:#f7f7f9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px"><div style="width:620px;height:175px;background:url(${P}vyra-logo-en.png) center/contain no-repeat"></div><div style="font-size:24px;font-weight:700;color:#16a34a">✓ You picked this one</div></div>`,
 (t,el,e)=>{const tp=e.t0+2.6;const sel=cl((t-tp)/.35);el.querySelectorAll('.lc').forEach((c,k)=>{const a=cl((t-e.t0-.7-k*.06)/.3);c.style.opacity=a*(k==4?1:1-.6*sel);c.style.transform=`scale(${(.85+.15*eo(a))*(k==4?1+.06*eb(sel):1)})`});
  const r=el.querySelector('.ring');r.style.opacity=sel;r.style.transform=`scale(${1+.06*eb(sel)})`;
  const f=el.querySelector('.tap'),fp=eio(cl((t-tp+1)/.9));f.style.left=lerp(700,400,fp)+'px';f.style.top=lerp(720,340,fp)+'px';f.style.opacity=cl((t-tp+1)/.2)*(1-cl((t-tp-.4)/.3));f.style.transform=`scale(${t>tp&&t<tp+.18?.8:1})`;
