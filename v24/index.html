</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// AIMY promo v24 "Zoom-through" — one continuous dive, every visual a pure function of t (window.seek)
const W = 1920, H = 1080;
const C = document.getElementById('c'), X = C.getContext('2d');
const F = '"Plus Jakarta Sans"';
['400','500','600','700','800','italic 800'].forEach(w => document.fonts.load(`${w} 40px "Plus Jakarta Sans"`));
const IMG = {};
['logo-sheet-nine-en.png','vyra-logo-en.png','aimy-logo-dark.png','01-original-photo.jpg','02-portrait.jpg','website-hero-en.jpg',
 'thumb-en-1.jpg','thumb-en-2.jpg','thumb-en-3.jpg','tiktok-en-squat.jpg','girl-pose-1.jpg','girl-pose-2.jpg','girl-pose-3.jpg','girl-pose-4.jpg',
 'girl-cover-1.png','cover-en-fitness-1.jpg','cover-en-move-your-city.jpg','ad-en-vyra-girl.jpg','ad-en-busy-routine.jpg','banner-en.jpg',
 'brand-hero-en.jpg','07-model-photo-1.jpg'].forEach(n => { const i = new Image(); i.src = 'assets/' + n; IMG[n] = i; });

// ---------- math ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ss = v => { v = cl(v); return v * v * (3 - 2 * v); };
const eio = v => { v = cl(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
const eout = v => 1 - Math.pow(1 - cl(v), 3);
const lerp = (a, b, p) => a + (b - a) * p;
const lr = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
const pop = (t, t0, d = .45) => { const v = cl((t - t0) / d); return v <= 0 ? 0 : 1 - Math.pow(1 - v, 3) * Math.cos(v * 4.2) ; };

// ---------- timeline (seconds; VO-driven, see audio/words.json) ----------
const T = window.TL || {};
const DUR = T.DUR || 53.4; window.DUR = DUR;
// level arrival times (camera reaches depth k fully) — dive k-1 → k ends here
const ARR = T.ARR || [0, 4.0, 11.6, 16.4, 21.1, 23.45, 26.35, 29.75, 32.45, 35.95, 38.7];
const DIVE = T.DIVE || 1.25;              // seconds per dive
const PULL0 = T.PULL0 || 43.4, PULL1 = T.PULL1 || 46.6;  // pull back out 10 → 0
const END0 = T.END0 || 46.6;              // end card fade starts
const EV = T.EV || { send: 4.3, reply: 5.4, card: 7.2, pick: 18.75, approve: 42.2, logoDraw: 13.0 };                    // misc event times

// ---------- portals: 16:9 rect of child inside parent (local 1920×1080 coords) ----------
// portal[k] = rect of level k+1 inside level k
const PORT = [
  [660, 199, 600, 337.5],     // 0 desk → laptop screen
  [780, 470, 576, 324],       // 1 chat → plan artifact card
  [1080, 380, 640, 360],      // 2 plan → logo preview tile
  [760, 467.5, 400, 225],     // 3 nine logos → picked one (center)
  [1176, 548, 544, 306],      // 4 brand kit → portrait photo tile
  [1336, 560, 448, 252],      // 5 portrait → website browser card
  [560, 300, 800, 450],       // 6 website → YouTube embed (after scroll)
  [1300, 700, 448, 252],      // 7 YouTube → posts card
  [1120, 650, 640, 360],      // 8 posts → X profile card
  [120, 690, 576, 324],       // 9 SNS cover → ads card
];
const NL = 11;

// ---------- camera depth d(t) ----------
function depth(t) {
  if (t >= PULL0) {
    const p = eio((t - PULL0) / (PULL1 - PULL0));
    return 10 * (1 - p);
  }
  let d = 0;
  for (let k = 1; k < NL; k++) {
    const a = ARR[k], s = a - DIVE;
    if (t >= a) d = k;
    else if (t > s) { d = k - 1 + eio((t - s) / DIVE); break; }
    else break;
  }
  // gentle constant push while holding (never static)
  if (d === Math.floor(d) && d < 10) {
    const k = d, nextS = ARR[k + 1] - DIVE, a = ARR[k];
    const p = cl((t - a) / Math.max(.1, nextS - a));
    d += 0.07 * p;
    // fold remaining into dive start so it's continuous: dive starts from k+0.07
  }
  return d;
}
// dive must start from k+0.07: adjust above by re-mapping within dive
function depthC(t) {
  if (t >= PULL0) return depth(t);
  for (let k = 1; k < NL; k++) {
    const a = ARR[k], s = a - DIVE;
    if (t > s && t < a) return (k - 1 + 0.07) + (1 - 0.07) * eio((t - s) / DIVE);
  }
  return depth(t);
}

// settle progress of a level (arrival state → final layout); rewinds on pull-out
function settle(k, t, d, dur = 1.1, lag = 0.05) {
  let u = ss((t - ARR[k] - lag) / dur);
  if (t >= PULL0) u = Math.min(u, ss((d - (k - 1)) * 1.4 - 0.2));
  return u;
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); X.fillStyle = c; X.fill(); }
function shadowed(fn, blur = 40, oy = 16, c = 'rgba(60,30,70,.16)') { X.save(); X.shadowColor = c; X.shadowBlur = blur; X.shadowOffsetY = oy; fn(); X.restore(); }
function card(x, y, w, h, r = 20, c = '#fff', sh = 1) { if (sh) shadowed(() => fillRR(x, y, w, h, r, c), 46 * sh, 18 * sh, `rgba(60,30,70,${.15 * sh})`); else fillRR(x, y, w, h, r, c); }
function txt(s, x, y, size, wt = 600, col = '#15131a', al = 'left', bl = 'alphabetic', it = '') { X.font = `${it}${wt} ${size}px ${F}`; X.fillStyle = col; X.textAlign = al; X.textBaseline = bl; X.fillText(s, x, y); }
function tw(s, size, wt = 600) { X.font = `${wt} ${size}px ${F}`; return X.measureText(s).width; }
function wrap(s, x, y, maxW, size, lh, wt = 600, col = '#15131a', maxLines = 9) {
  const words = s.split(' '); let line = '', n = 0;
  for (const w of words) { const tst = line ? line + ' ' + w : w; if (tw(tst, size, wt) > maxW && line) { txt(line, x, y + n * lh, size, wt, col); line = w; n++; if (n >= maxLines) return n; } else line = tst; }
  if (line) txt(line, x, y + n * lh, size, wt, col); return n + 1;
}
function grad(x0, y0, x1, y1, stops) { const g = X.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
const GR = (x, y, w) => grad(x, y, x + w, y, ['#FF8A1F', '#FF4B61', '#FF2DBA']);
// draw image cover-fit into rect (optional focus fx,fy 0..1), with optional crop source rect
function imgCover(im, x, y, w, h, fx = .5, fy = .5, src) {
  if (!im || !im.complete || !im.naturalWidth) { X.fillStyle = '#eee'; X.fillRect(x, y, w, h); return; }
  let [sx, sy, sw, sh] = src || [0, 0, im.naturalWidth, im.naturalHeight];
  const ar = w / h, sar = sw / sh;
  if (sar > ar) { const nw = sh * ar; sx += (sw - nw) * fx; sw = nw; } else { const nh = sw / ar; sy += (sh - nh) * fy; sh = nh; }
  X.drawImage(im, sx, sy, sw, sh, x, y, w, h);
}
function imgRR(im, x, y, w, h, r, fx, fy, src) { X.save(); rr(x, y, w, h, r); X.clip(); imgCover(im, x, y, w, h, fx, fy, src); X.restore(); }
function imgFit(im, x, y, w, h, src) { // contain
  if (!im || !im.naturalWidth) return; let [sx, sy, sw, sh] = src || [0, 0, im.naturalWidth, im.naturalHeight];
  const s = Math.min(w / sw, h / sh); X.drawImage(im, sx, sy, sw, sh, x + (w - sw * s) / 2, y + (h - sh * s) / 2, sw * s, sh * s);
}
function avatar(x, y, r, label, c1 = '#6d5dfc', c2 = '#c04cf0') {
  X.beginPath(); X.arc(x, y, r, 0, 7); X.fillStyle = grad(x - r, y - r, x + r, y + r, [c1, c2]); X.fill();
  txt(label, x, y + 1, r * .78, 800, '#fff', 'center', 'middle');
}
function check(x, y, r, p = 1) {
  if (p <= 0) return; X.save(); X.translate(x, y); X.scale(p, p);
  X.beginPath(); X.arc(0, 0, r, 0, 7); X.fillStyle = '#22c55e'; X.fill();
  X.beginPath(); X.moveTo(-r * .45, 0); X.lineTo(-r * .1, r * .35); X.lineTo(r * .5, -r * .35); X.strokeStyle = '#fff'; X.lineWidth = r * .28; X.lineCap = 'round'; X.lineJoin = 'round'; X.stroke(); X.restore();
}
function badge(x, y, s, bg = '#15131a', fg = '#fff', size = 18) { const w = tw(s, size, 800) + size * 1.4; fillRR(x, y, w, size * 1.9, size * .95, bg); txt(s, x + w / 2, y + size * .97, size, 800, fg, 'center', 'middle'); return w; }
function tag(s, x, y, size = 18) { X.font = `800 ${size}px ${F}`; const w = X.measureText(s).width + s.length * size * .16; X.save(); X.fillStyle = GR(x, y, w); X.textBaseline = 'alphabetic'; X.textAlign = 'left'; if ('letterSpacing' in X) X.letterSpacing = `${size * .16}px`; X.fillText(s, x, y); X.restore(); }
let PAT = null;
function dots() { if (PAT) return PAT; const c = document.createElement('canvas'); c.width = c.height = 44; const g = c.getContext('2d'); g.fillStyle = 'rgba(40,20,60,.09)'; g.beginPath(); g.arc(22, 22, 2.2, 0, 7); g.fill(); PAT = X.createPattern(c, 'repeat'); return PAT; }
function studioBg(c1, c2, bx1 = .18, by1 = .2, bx2 = .85, by2 = .85) {
  X.fillStyle = '#faf7f4'; X.fillRect(0, 0, W, H);
  for (const [c, bx, by, r] of [[c1, bx1, by1, 900], [c2, bx2, by2, 950]]) {
    const g = X.createRadialGradient(W * bx, H * by, 0, W * bx, H * by, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(250,247,244,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
  }
  X.fillStyle = dots(); X.fillRect(0, 0, W, H);
}
// a cursor (arrow) at x,y with press amount
function cursor(x, y, press = 0, a = 1) {
  if (a <= 0) return; X.save(); X.globalAlpha = a; X.translate(x, y); const s = 1.5 * (1 - press * .15); X.scale(s, s);
  X.beginPath(); X.moveTo(0, 0); X.lineTo(0, 22); X.lineTo(6, 17); X.lineTo(10, 26); X.lineTo(14, 24); X.lineTo(10, 16); X.lineTo(17, 16); X.closePath();
  X.fillStyle = '#15131a'; X.strokeStyle = '#fff'; X.lineWidth = 2; X.fill(); X.stroke(); X.restore();
}
function ring(x, y, r, p, col = '#FF4B61') { if (p <= 0 || p >= 1) return; X.save(); X.globalAlpha = 1 - p; X.beginPath(); X.arc(x, y, r * (0.3 + p), 0, 7); X.strokeStyle = col; X.lineWidth = 6 * (1 - p) + 1; X.stroke(); X.restore(); }

// sheet crops (logo-sheet-nine-en.png 2048²): 3×3 cells
const LC = (i) => { const cx = [352, 1030, 1690][i % 3], cy = [325, 972, 1555][Math.floor(i / 3)]; return [cx - 330, cy - 125, 660, 250]; };

// ================= LEVELS (each draws in local 1920×1080) =================
const L = [];

// ---- L0: white studio desk with a laptop ----
L[0] = (t, d) => {
  // cyclorama wall
  X.fillStyle = grad(0, 0, 0, 760, ['#f3f1ee', '#f8f6f3', '#efece8']); X.fillRect(0, 0, W, 760);
  let g = X.createRadialGradient(960, 330, 50, 960, 330, 1100); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)'); X.fillStyle = g; X.fillRect(0, 0, W, 760);
  // soft pastel glow behind laptop (brand)
  g = X.createRadialGradient(960, 420, 0, 960, 420, 760); g.addColorStop(0, 'rgba(255,150,120,.18)'); g.addColorStop(.5, 'rgba(200,140,255,.10)'); g.addColorStop(1, 'rgba(255,255,255,0)'); X.fillStyle = g; X.fillRect(0, 0, W, 760);
  // desk top
  X.fillStyle = grad(0, 690, 0, 1080, ['#ffffff', '#f6f4f1', '#ebe7e2']); X.fillRect(0, 690, W, 390);
  X.fillStyle = 'rgba(0,0,0,.05)'; X.fillRect(0, 688, W, 3);
  // desk front edge
  X.fillStyle = grad(0, 1010, 0, 1080, ['#e9e5df', '#d9d4cd']); X.fillRect(0, 1010, W, 70);
  // window light stripes on the wall
  X.save(); X.globalAlpha = .35; for (let i = 0; i < 3; i++) { X.fillStyle = 'rgba(255,255,255,.9)'; X.beginPath(); const x0 = 1450 + i * 120; X.moveTo(x0, 60); X.lineTo(x0 + 70, 60); X.lineTo(x0 + 210, 680); X.lineTo(x0 + 140, 680); X.fill(); } X.restore();
  // plant (left)
  shadowed(() => { X.fillStyle = '#ffffff'; rr(250, 560, 150, 140, 18); X.fill(); }, 30, 10, 'rgba(0,0,0,.12)');
  X.fillStyle = grad(250, 0, 400, 0, ['#f2f0ed', '#ffffff', '#e8e5e1']); rr(250, 560, 150, 140, 18); X.fill();
  const leaves = [[325, 470, 30, 95, -.5], [300, 500, 26, 80, -1.0], [350, 495, 26, 85, .6], [280, 530, 22, 60, -1.4], [372, 530, 22, 62, 1.2], [325, 430, 22, 70, .1]];
  leaves.forEach(([x, y, rx, ry, a], i) => { const sw = Math.sin(t * 1.1 + i) * .03; X.save(); X.translate(x, y + 60); X.rotate(a * .6 + sw); X.beginPath(); X.ellipse(0, -ry * .5, rx, ry * .62, 0, 0, 7); X.fillStyle = i % 2 ? '#7fae8c' : '#93c09f'; X.fill(); X.restore(); });
  // mug (right)
  shadowed(() => fillRR(1500, 590, 110, 120, 14, '#fff'), 26, 10, 'rgba(0,0,0,.12)');
  X.fillStyle = grad(1500, 0, 1610, 0, ['#f1efec', '#fff', '#e6e3df']); rr(1500, 590, 110, 120, 14); X.fill();
  X.fillStyle = GR(1500, 0, 110); X.fillRect(1500, 630, 110, 16);
  X.beginPath(); X.ellipse(1628, 646, 26, 30, 0, 0, 7); X.lineWidth = 12; X.strokeStyle = '#efece8'; X.stroke();
  // notebook + pen
  X.save(); X.translate(1380, 860); X.transform(1, 0, -.35, 1, 0, 0); shadowed(() => fillRR(0, 0, 300, 110, 8, '#fdfcfa'), 18, 6, 'rgba(0,0,0,.10)'); X.fillStyle = '#FF8A1F'; X.fillRect(0, 0, 14, 110); X.restore();
  X.save(); X.translate(1430, 990); X.rotate(-.08); fillRR(0, 0, 240, 10, 5, '#2a2830'); X.restore();
  // phone lying on desk
  X.save(); X.translate(330, 880); X.transform(1, 0, .45, 1, 0, 0); shadowed(() => fillRR(0, 0, 230, 100, 18, '#1b1a20'), 18, 6, 'rgba(0,0,0,.18)'); X.restore();
  // laptop shadow
  g = X.createRadialGradient(960, 660, 10, 960, 660, 520); g.addColorStop(0, 'rgba(40,30,50,.28)'); g.addColorStop(1, 'rgba(40,30,50,0)'); X.save(); X.translate(960, 662); X.scale(1, .1); X.translate(-960, -662); X.fillStyle = g; X.fillRect(300, 300, 1320, 720); X.restore();
  // laptop lid
  shadowed(() => fillRR(640, 182, 640, 394, 22, '#cfd0d5'), 30, 8, 'rgba(0,0,0,.12)');
  fillRR(642, 184, 636, 390, 20, '#16161a');
  X.beginPath(); X.arc(960, 191, 3, 0, 7); X.fillStyle = '#333'; X.fill();
  // base (keyboard deck in perspective)
  X.beginPath(); X.moveTo(612, 574); X.lineTo(1308, 574); X.lineTo(1392, 636); X.lineTo(528, 636); X.closePath(); X.fillStyle = grad(0, 574, 0, 636, ['#d8d9de', '#c4c5cb']); X.fill();
  fillRR(520, 634, 880, 14, 7, '#b4b5bb');
  X.beginPath(); X.moveTo(880, 636); X.lineTo(1040, 636); X.lineTo(1030, 642); X.lineTo(890, 642); X.fillStyle = '#a5a6ac'; X.fill();
  X.fillStyle = 'rgba(0,0,0,.08)'; for (let r = 0; r < 4; r++) { const y = 580 + r * 11, ins = 54 - r * 13; X.fillRect(640 + ins - 20, y, 640 - 2 * ins + 40, 6); }
  // screen glare
  X.save(); rr(...PORT[0], 4); X.clip(); X.restore();
};
L[0].glare = (p) => { // drawn above child
  const [x, y, w, h] = PORT[0]; X.save(); rr(x, y, w, h, 2); X.clip(); X.globalAlpha = .18 * p;
  X.fillStyle = grad(x, y, x + w, y + h, ['rgba(255,255,255,.9)', 'rgba(255,255,255,0)', 'rgba(255,255,255,0)']); X.fillRect(x, y, w, h); X.restore();
};

// ---- L1: AIMY chat app ----
L[1] = (t, d) => {
  X.fillStyle = '#ffffff'; X.fillRect(0, 0, W, H);
  // sidebar
  X.fillStyle = '#f6f5f8'; X.fillRect(0, 0, 360, H); X.fillStyle = '#ecebef'; X.fillRect(359, 0, 1, H);
  fillRR(28, 200, 304, 54, 14, '#fff'); txt('+  New chat', 52, 236, 21, 700, '#15131a');
  txt('CHATS', 40, 300, 15, 800, '#a39cae');
  [['VYRA launch', 1], ['Spring promo', 0], ['Weekly plan', 0]].forEach(([s, a], i) => { if (a) fillRR(28, 318 + i * 56, 304, 48, 12, '#ebe7f5'); txt(s, 52, 350 + i * 56, 20, a ? 800 : 600, a ? '#15131a' : '#6b6475'); });
  txt('YOUR TEAM', 40, 540, 15, 800, '#a39cae');
  [['01', 'Project Manager'], ['13', 'Logo'], ['14', 'Brand Kit'], ['15', 'Portrait'], ['17', 'Website'], ['42', 'Ads']].forEach(([n, s], i) => { avatar(62, 580 + i * 52, 18, n); txt(s, 92, 587 + i * 52, 19, 600, '#3d3846'); });
  txt('+ 46 more employees', 40, 910, 17, 700, '#8a8494');
  // header
  X.fillStyle = '#fff'; X.fillRect(360, 0, W - 360, 104); X.fillStyle = '#eee'; X.fillRect(360, 104, W - 360, 1);
  const lg = IMG['aimy-logo-dark.png']; if (lg.naturalWidth) X.drawImage(lg, 400, 22, 86, 60.6);
  txt('VYRA launch', 510, 50, 26, 800); X.beginPath(); X.arc(518, 76, 5, 0, 7); X.fillStyle = '#22c55e'; X.fill(); txt('52 AI employees in this chat', 530, 82, 18, 600, '#8a8494');
  // conversation (times relative to EV)
  const tU = EV.send ?? 2.6, tR = EV.reply ?? 5.2, tCard = EV.card ?? 6.8;
  const typed = 'Launch my home-fitness brand, VYRA.';
  const nT = Math.floor(cl((t - (tU - 1.6)) / 1.4) * typed.length);
  // user bubble
  const ua = pop(t, tU, .5);
  if (ua > 0) { const bw = tw(typed, 26, 700) + 56; X.save(); X.globalAlpha = cl(ua); X.translate(1720 - bw, 160 + (1 - cl(ua)) * 30); shadowed(() => fillRR(0, 0, bw, 64, 26, '#FF6A3D'), 20, 8, 'rgba(255,60,90,.25)'); fillRR(0, 0, bw, 64, 26, GR(0, 0, bw)); txt(typed, 28, 41, 26, 700, '#fff'); X.restore(); }
  // PM reply
  const ra = cl((t - tR) / .4);
  if (ra > 0) {
    X.save(); X.globalAlpha = ra; X.translate(0, (1 - eout(ra)) * 24);
    avatar(712, 290, 30, '01'); txt('Project Manager', 760, 276, 19, 800, '#6b6475');
    const msg = 'On it. 52 AI employees, in a fixed order. Here is the plan.';
    const nm = Math.floor(cl((t - tR) / 1.2) * msg.length);
    const mw = tw(msg, 25, 600) + 48; fillRR(760, 292, mw, 64, 20, '#f3f1f6'); txt(msg.slice(0, nm), 784, 333, 25, 600);
    X.restore();
  }
  // plan artifact card frame around the portal
  const ca = cl((t - tCard) / .5);
  if (ca > 0) { const [x, y, w, h] = PORT[1]; X.save(); X.globalAlpha = ca; card(x - 10, y - 10, w + 20, h + 64, 22, '#fff'); txt('THE PLAN · VYRA launch', x + 4, y + h + 40, 18, 800, '#6b6475'); txt('Open  →', x + w - 4, y + h + 40, 18, 800, '#FF4B61', 'right'); X.restore(); }
  // composer
  fillRR(560, 960, 1180, 76, 38, '#f3f1f6');
  if (t < tU) txt(nT > 0 ? typed.slice(0, nT) + (Math.floor(t * 3) % 2 ? '|' : '') : 'Message your team…', 600, 1007, 24, 600, nT > 0 ? '#15131a' : '#9a94a3');
  else txt('Message your team…', 600, 1007, 24, 600, '#9a94a3');
  X.beginPath(); X.arc(1700, 998, 26, 0, 7); X.fillStyle = GR(1674, 0, 52); X.fill(); txt('↑', 1700, 1000, 28, 800, '#fff', 'center', 'middle');
  ring(1700, 998, 50, (t - tU + .05) / .5);
};
L[1].childVisible = (t) => cl((t - (EV.card ?? 6.8)) / .5);

// ---- L2: Project Manager plan ----
const PLAN = [['01', 'Project Manager'], ['02', 'Counseling'], ['05', 'Market Analysis'], ['11', 'Knowledge'], ['12', 'Funnel'], ['13', 'Logo'], ['14', 'Brand Kit'], ['15', 'Portrait'], ['17', 'Website'], ['21', 'YouTube'], ['23', 'Thumbnail'], ['24–29', 'X · Instagram · TikTok · Facebook'], ['35', 'SNS Cover'], ['42', 'Ads']];
L[2] = (t, d) => {
  studioBg('rgba(255,176,0,.30)', 'rgba(192,76,240,.20)');
  const x = 180, y = 200, w = 800, h = 840;
  card(x, y, w, h, 28);
  tag('01 · PROJECT MANAGER', x + 44, y + 62, 18);

  X.save(); X.translate(bx + bw / 2, by + bh / 2); X.scale(1 - press * .05, 1 - press * .05);
  fillRR(-bw / 2, -bh / 2, bw, bh, 38, ok > .5 ? '#22c55e' : GR(-bw / 2, 0, bw)); txt(ok > .5 ? 'Approved ✓' : 'Approve', 0, 2, 26, 800, '#fff', 'center', 'middle'); X.restore();
  fillRR(1530, 780, 190, 76, 38, '#f3f1f6'); txt('Edit', 1625, 827, 24, 800, '#15131a', 'center');
  ring(bx + bw / 2, by + bh / 2, 160, (t - tA) / .6, '#22c55e');
  // cursor
  const ca = cl((t - (tA - 1.3)) / .3) * (1 - cl((t - tA - .9) / .3)), cp = eio((t - (tA - 1.3)) / 1.15);
  cursor(lerp(1000, bx + bw / 2 + 20, cp), lerp(1000, by + bh / 2 + 10, cp), press, ca);
};

// ================= camera + nesting =================
function drawLevel(k, t, d, depthAlpha = 1) {
  X.save(); L[k](t, d); X.restore();
}
function portalOf(k, t, d) { const p = PORT[k].slice(); if (L[k].portalY) p[1] += L[k].portalY(t, d); return p; }
function render(t) {
  const d = depthC(t);
  const k = Math.min(10, Math.floor(d + 1e-9)), f = d - k;
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#faf7f4'; X.fillRect(0, 0, W, H);
  // transform of level k on screen
  let [px, py, pw] = portalOf(Math.min(k, 9), t, d); let s = pw / W;
  let Z = 1, ox = 0, oy = 0;
  if (k < 10 && f > 0) { Z = Math.pow(1 / s, f); const fx = px / (1 - s), fy = py / (1 - s); ox = fx * (1 - Z); oy = fy * (1 - Z); }
  // draw level k, then descendants inside nested portal clips
  let M = [Z, ox, oy], Mprev = M;
  X.save(); X.setTransform(Z, 0, 0, Z, ox, oy); X.save(); L[k](t, d); X.restore();
  for (let j = k + 1; j <= Math.min(10, k + 3); j++) {
    const [qx, qy, qw, qh] = portalOf(j - 1, t, d);
    Mprev = M; M = [M[0] * qw / W, M[1] + M[0] * qx, M[2] + M[0] * qy];
    if (qw * Mprev[0] < 3) break;
    const vis = L[j - 1].childVisible ? L[j - 1].childVisible(t, d) : 1; if (vis <= 0) break;
    X.setTransform(Mprev[0], 0, 0, Mprev[0], Mprev[1], Mprev[2]);
    const ff = j === k + 1 ? f : 0; rr(qx, qy, qw, qh, (j - 1 === 0 ? 3 : 14) * (1 - ss(ff * 1.15))); X.clip();
    X.setTransform(M[0], 0, 0, M[0], M[1], M[2]); X.save(); X.globalAlpha = vis; L[j](t, d); X.restore();
    if (j - 1 === 0) { X.setTransform(Mprev[0], 0, 0, Mprev[0], Mprev[1], Mprev[2]); L[0].glare(1 - f); }
  }
  X.restore();
  // dive speed: soft white edge glow
  const sp = Math.min(1, Math.abs(depthC(t + .02) - depthC(t - .02)) / .04 / 1.6);
  if (sp > .01) { X.setTransform(1, 0, 0, 1, 0, 0); const g = X.createRadialGradient(960, 540, 300, 960, 540, 1150); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${.55 * sp})`); X.fillStyle = g; X.fillRect(0, 0, W, H); }
  overlay(t, d);
}

// ================= screen-space overlay: caption + depth gauge =================
const CAPS = T.CAPS || [
  { t0: .9, t1: 3.4, tag: 'AIMY', title: 'Start at your desk.', sub: 'Open one chat.' },
  { t0: 4.6, t1: 10.2, tag: 'ONE CHAT', title: 'A company of AI employees.', sub: '52 of them, working in a fixed order.' },
  { t0: 11.5, t1: 14.9, tag: '01 · PROJECT MANAGER', title: 'Plans the whole launch.', sub: 'Every employee, in order.' },
  { t0: 16.3, t1: 19.6, tag: '13 · LOGO', title: 'Nine ideas.', sub: 'You pick one.' },
  { t0: 21.1, t1: 23.1, tag: '14 · BRAND KIT', title: 'The full look.', sub: 'Logo, colors, type and photos.' },
  { t0: 23.6, t1: 26.0, tag: '15 · PORTRAIT', title: 'Selfie in.', sub: 'Studio portrait out.' },
  { t0: 26.5, t1: 28.4, tag: '17 · WEBSITE', title: 'The landing page.', sub: 'Built in the same chat.' },
  { t0: 29.8, t1: 32.2, tag: '21 · 23 · YOUTUBE + THUMBNAIL', title: 'The channel.', sub: 'Video pages and thumbnails.' },
  { t0: 32.6, t1: 35.6, tag: '24–29 · SOCIAL', title: 'Posts for every app.', sub: 'X, Instagram, TikTok, Threads, Facebook.' },
  { t0: 36.1, t1: 38.3, tag: '35 · SNS COVER', title: 'Every profile, dressed.', sub: 'A cover for each channel.' },
  { t0: 38.8, t1: 43.2, tag: '42 · ADS', title: 'The campaign.', sub: 'Nothing spends until you approve.' },
  { t0: 43.6, t1: 46.3, tag: 'EVERY LEVEL', title: 'Built on the one before.', sub: '' },
];
const GAUGE = ['Desk', 'Chat', '01 Plan', '13 Logo', '14 Brand Kit', '15 Portrait', '17 Website', '21·23 YouTube', '24–29 Posts', '35 SNS Cover', '42 Ads'];
function overlay(t, d) {
  X.setTransform(1, 0, 0, 1, 0, 0);
  // caption
  for (const c of CAPS) {
    const a = ss((t - c.t0) / .35) * (1 - ss((t - c.t1) / .3)); if (a <= 0) continue;
    X.save(); X.globalAlpha = a; X.translate(0, (1 - eout(cl((t - c.t0) / .4))) * 16);
    X.font = `800 50px ${F}`; let w = X.measureText(c.title).width; X.font = `600 22px ${F}`; w = Math.max(w, X.measureText(c.sub || '').width, tw(c.tag, 17, 800) * 1.25) + 64;
    X.save(); X.shadowColor = 'rgba(60,30,70,.14)'; X.shadowBlur = 30; X.shadowOffsetY = 10; fillRR(36, 36, w, c.sub ? 148 : 118, 22, 'rgba(255,255,255,.95)'); X.restore();
    tag(c.tag, 68, 80, 17); txt(c.title, 66, 134, 50, 800); if (c.sub) txt(c.sub, 68, 168, 22, 600, '#6b6475');
    X.restore();
  }
  // depth gauge (right edge)
  const ga = (1 - ss((t - (END0 - .3)) / .4)) * ss((t - .3) / .6);
  if (ga > 0) {
    X.save(); X.globalAlpha = ga;
    const x = 1872, y0 = 250, y1 = 830, n = GAUGE.length, step = (y1 - y0) / (n - 1);
    X.save(); X.shadowColor = 'rgba(60,30,70,.12)'; X.shadowBlur = 24; fillRR(x - 26, y0 - 40, 52, y1 - y0 + 80, 26, 'rgba(255,255,255,.88)'); X.restore();
    X.fillStyle = '#e6e2ea'; X.fillRect(x - 1.5, y0, 3, y1 - y0);
    X.fillStyle = GR(0, 0, 10); X.fillRect(x - 1.5, y0, 3, cl(d / 10) * (y1 - y0));
    for (let i = 0; i < n; i++) { const y = y0 + i * step, on = d >= i - .02; X.beginPath(); X.arc(x, y, on ? 7 : 5, 0, 7); X.fillStyle = on ? '#FF4B61' : '#cfcad6'; X.fill(); }
    const yy = y0 + cl(d / 10) * (y1 - y0); X.beginPath(); X.arc(x, yy, 13, 0, 7); X.fillStyle = '#fff'; X.fill(); X.lineWidth = 4; X.strokeStyle = '#FF4B61'; X.stroke();
    const ni = Math.round(d); const la = 1 - Math.min(1, Math.abs(d - ni) * 3);
    if (la > 0) { const s = GAUGE[ni]; const w = tw(s, 18, 800) + 30; X.globalAlpha = ga * la; X.save(); X.shadowColor = 'rgba(60,30,70,.15)'; X.shadowBlur = 18; fillRR(x - 34 - w, yy - 20, w, 40, 20, '#15131a'); X.restore(); txt(s, x - 34 - w / 2, yy + 1, 18, 800, '#fff', 'center', 'middle'); }
    X.globalAlpha = ga * .8; txt('DEPTH', x, y0 - 54, 13, 800, '#8a8494', 'center');
    X.restore();
  }
  // end card
  const ea = ss((t - END0) / .6);
  if (ea > 0) {
    X.save(); X.globalAlpha = ea; X.fillStyle = '#faf7f4'; X.fillRect(0, 0, W, H);
    for (const [c, bx, by] of [['rgba(255,176,0,.22)', .2, .2], ['rgba(192,76,240,.16)', .85, .85]]) { const g = X.createRadialGradient(W * bx, H * by, 0, W * bx, H * by, 900); g.addColorStop(0, c); g.addColorStop(1, 'rgba(250,247,244,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H); }
    const lg = IMG['aimy-logo-dark.png'], s = lerp(1.08, 1, eout((t - END0) / 2.2)), lw = 470 * s, lh = lw * 634 / 900;
    if (lg.naturalWidth) X.drawImage(lg, 960 - lw / 2, 430 - lh / 2, lw, lh);
    const a2 = ss((t - END0 - .9) / .5); X.globalAlpha = ea * a2;
    txt('A company of AI employees in one chat.', 960, 760, 46, 800, '#15131a', 'center');
    txt('52 AI employees · Every level built on the one before', 960, 812, 24, 600, '#6b6475', 'center');
    const a3 = ss((t - END0 - 1.6) / .5); X.globalAlpha = ea * a3;
    fillRR(960 - 300, 866, 600, 72, 36, '#fff'); X.save(); X.shadowColor = 'rgba(60,30,70,.12)'; X.shadowBlur = 24; X.restore();
    txt('Give the work. Approve the result.', 1000 - 300 + 28, 911, 22, 700, '#15131a'); X.beginPath(); X.arc(960 + 300 - 36, 902, 24, 0, 7); X.fillStyle = GR(960 + 240, 0, 48); X.fill(); txt('↑', 960 + 264, 904, 26, 800, '#fff', 'center', 'middle');
    X.restore();
  }
  // opening fade-in from white
  const fa = 1 - ss(t / .5); if (fa > 0) { X.fillStyle = `rgba(250,247,244,${fa})`; X.fillRect(0, 0, W, H); }
}

window.seek = (t) => { render(Math.max(0, Math.min(DUR - 1e-3, t))); };
setTimeout(() => window.seek(0), 300);
</script>
